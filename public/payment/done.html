<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата завершена — AI-ассистент MAX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #9aa0b0;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .highlight {
      color: #7c6af7;
      font-weight: 600;
    }
    .divider {
      border: none;
      border-top: 1px solid #2a2d3a;
      margin: 24px 0;
    }
    .note {
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Оплата прошла успешно</h1>
    <p>Подписка <span class="highlight">Premium</span> активируется в течение нескольких секунд.</p>
    <p>Бот отправит вам подтверждение в мессенджере MAX.</p>
    <hr class="divider">
    <p class="note">Вернитесь в мессенджер MAX и продолжите общение с ботом.</p>
  </div>
</body>
</html>
